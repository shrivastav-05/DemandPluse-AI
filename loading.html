<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Training Model</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: Arial, sans-serif;
        background: #f3f6fb;
        color: #202b3c;
      }

      .card {
        width: min(520px, 100%);
        padding: 34px;
        text-align: center;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 28px rgba(25, 50, 90, 0.08);
      }

      .spinner {
        width: 48px;
        height: 48px;
        margin: 12px auto 24px;
        border: 5px solid #dbeafe;
        border-top-color: #2457c5;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      h1 {
        color: #183b70;
      }
      p {
        color: #586477;
        line-height: 1.7;
      }

      .btn {
        padding: 12px 18px;
        border: 0;
        border-radius: 8px;
        background: #2457c5;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <main class="card">
      <div class="spinner" aria-hidden="true"></div>

      <h1>Training Your Model</h1>

      <p>
        The model is being trained and evaluated. Please wait for the prediction
        result.
      </p>

      <form
        id="trainingForm"
        action="{{ url_for('start_training') }}"
        method="POST"
      >
        {% for key, value in form_data.items() %}
        <input type="hidden" name="{{ key }}" value="{{ value }}" />
        {% endfor %}

        <button type="submit" class="btn" id="startButton">
          Start Training
        </button>
      </form>
    </main>

    <script>
      const form = document.getElementById("trainingForm");
      const button = document.getElementById("startButton");

      form.addEventListener("submit", function () {
        button.disabled = true;
        button.textContent = "Training in progress...";
      });

      window.addEventListener("load", function () {
        form.requestSubmit();
      });
    </script>
  </body>
</html>
